# REG.RU / ISPmanager. Include at SERVER context via:
# /etc/nginx/vhosts-resources/rr-tac.ru/site-security.conf
# Do not replace the ISPmanager server block or its existing location /.
# Install with administrator access; run nginx -t before reloading Nginx.
# Apache backend: 127.0.0.1:8080. This file does not enable/redirect to HTTPS.
# Keep secrets and updater scripts outside the document root regardless.

# Server-level return guards run before location selection. This is deliberate:
# ISPmanager's nested static-file regex locations can bypass outer regex rules.
# The dotfile exception permits only a normal ACME challenge token.
if ($uri ~ "(^|/)\.(?!well-known/acme-challenge/[A-Za-z0-9_-]+$)") {
    return 404;
}
if ($uri ~* "(^|/)(config|vendor|backups|dist|server-version|tests|deployment)(/|$)") {
    return 404;
}
if ($uri ~* "^/(update-site|sync-products|csv-to-json|generate-site|verify-build)\.js$") {
    return 404;
}
if ($uri ~* "\.(env|ini|log|sql|bak|old|orig|swp|md|csv|rar|zip|tar|gz)(/|$)") {
    return 404;
}
# Reject PHP files, source copies and PATH_INFO everywhere except exact entries.
# Only the suffix is case-insensitive; the allowed paths stay case-sensitive.
if ($uri ~ "^/(?!assets/php/(send|mail|order)\.php$).*\.(?i:php[0-9]*|phtml|phar|phps)([/.]|$)") {
    return 404;
}

# Exact locations take precedence over the deny prefix below.
location = /assets/php/send.php {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
}
location = /assets/php/mail.php {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
}
location = /assets/php/order.php {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
}
location = /assets/php {
    return 404;
}
location ^~ /assets/php/ {
    return 404;
}
