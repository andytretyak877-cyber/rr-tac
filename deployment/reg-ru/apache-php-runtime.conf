# REG.RU only. Keep the site's PHP files inside the ISPmanager isolation.
# Enable via a2enconf rr-tac-php-runtime; configtest before reloading Apache.
<Directory "/var/www/www-root/data/www/rr-tac.ru">
    <IfModule php_module>
        php_admin_value sys_temp_dir "/var/www/www-root/data/mod-tmp"
        php_admin_value open_basedir "/var/www/www-root/data:/var/www/config:."
    </IfModule>
</Directory>
